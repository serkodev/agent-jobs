# agent-jobs:start
{{AGENTS_SECTION}}[mcp_servers.agent_jobs]
command = "node"
args = [{{SCRIPT_PATH}}, "mcp"]
required = true
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled_tools = ["get_assignment", "submit_result", "report_failure"]
default_tools_approval_mode = "auto"

[mcp_servers.agent_jobs.tools.report_failure]
approval_mode = "approve"

[mcp_servers.agent_jobs.tools.get_assignment]
approval_mode = "approve"

[mcp_servers.agent_jobs.tools.submit_result]
approval_mode = "approve"{{PROJECT_ENV_SECTION}}
# agent-jobs:end
